# SMG-3DS controls. Keys: A B X Y L R ZL ZR Up Down Left Right Start Select; any of the keys joined with + does it.
# pointer: stylus (touch the bottom screen; in Azahar, click it with the mouse),
#          cstick (the C-Stick moves it; a gamepad's right stick in Azahar), or motion (the 3DS's gyro).
pointer=stylus
motion_speed=100
stick_speed=100
invert_x=0
invert_y=0
bind.jump=A+B
bind.spin=X+Y
bind.crouch=L
bind.shoot=R
bind.camera=ZL
bind.recenter=ZR
bind.pause=Start
bind.minus=Select

# FPS build only: the bottom screen shows FPS / ms per frame / slowest frame.
# It is ON by default; add dev.show_fps=0 below to hide it. Other builds ignore this key.
